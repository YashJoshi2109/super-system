<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="Super 8 Bedford DFW West Shuttle Service - Real-time micro-logistics for hotel transportation" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/gif" href="/bus-journey.gif" />
    <title>Super 8 Shuttle Service</title>
    <script>
      // CRITICAL: Set theme immediately before React loads to prevent white flash
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme') || 'dark';
          const isLight = savedTheme === 'light';
          document.documentElement.className = isLight ? 'light' : 'dark';
          document.documentElement.style.backgroundColor = isLight ? '#ffffff' : '#0f172a';
          document.documentElement.style.color = isLight ? '#1e293b' : '#f1f5f9';
          document.body.className = isLight ? 'light bg-white text-slate-900' : 'dark bg-slate-950 text-slate-100';
          document.body.style.backgroundColor = isLight ? '#ffffff' : '#0f172a';
          document.body.style.color = isLight ? '#1e293b' : '#f1f5f9';
        } catch(e) {
          // Fallback to dark theme
          document.documentElement.className = 'dark';
          document.documentElement.style.backgroundColor = '#0f172a';
          document.documentElement.style.color = '#f1f5f9';
        }
      })();
    </script>
    <style>
      /* Prevent white flash on page load - Critical inline CSS */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background-color: #0f172a !important;
        color: #f1f5f9 !important;
        overflow-x: hidden;
      }
      html.light, html.light body {
        background-color: #ffffff !important;
        color: #1e293b !important;
      }
      #root {
        min-height: 100vh;
        background-color: inherit;
      }
      /* Loading spinner while React loads */
      #root:empty::before {
        content: '';
        display: block;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 4px solid rgba(99, 102, 241, 0.3);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
    </style>
  </head>
  <body class="dark bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
